version: 1.0.4
global:
  application: 26099-Procesos-Especiales-Batch-AWS
  tech: terraform
  language: terraform
  jdk: 8
  # Código translator (Lambdas, layer, frontend ECR/ECS): tf_trnsltr_btch (scripts/deploy.py).
  # Este repo solo despliega infra Terraform + layer batch common_python_dependencies.
develop:
  before_build:
    cmd:
      script: |
        echo "=== INSTALANDO DEPENDENCIAS EN LAMBDAS ==="
        sh scripts/install-lambda-deps.sh
    checkmarx:
      projectNameCx: SCPEBA/EITS SLA CO PROCESOS ESPECIALES BATCH AWS/tf_fw_dynbtch
  build:
    zip:
      zipFile: eec-aws-us-eits-procesosbatch-dev.zip
  after_build:
    sonarQubeScan:
      skip: true
      sources: .
      projectKey: SP-LATAM:EITS:DevSecOps:26099_Procesos-Especiales-Batch-AWS
      projectName: SP-LATAM:EITS:DevSecOps:26099_Procesos-Especiales-Batch-AWS
      projectVersion: 1
      terraform.provider.aws.version: 5.51.1
  before_deploy:
    cmd: |-
      cp trunk/* develop/
  deploy:
    terraform:
      accountid: 651706752126
      tfVersion: 1.9.0
