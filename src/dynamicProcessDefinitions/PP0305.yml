      descripcion: "Generación de tabla de catalogo_cuentas_ext"
      procedimientos:
        - step_name: "crear_tabla_catalogo_cuentas_ext"
          step_procedure: bdm_datos.sp_crear_tabla_catalogo_cuentas_ext
          step_description: "Crea la tabla de catalogo_cuentas_ext."
    - nivel: 2
      descripcion: "Generación de estadísticas y UNLOAD de la tabla de catalogo_cuentas_ext"
      procedimientos:
