          step_description: "Crea la tabla intermedia para typeOfData3 (Maestro de Clientes)"
        - step_name: "crear_tabla_typeOfData10"
          step_procedure: bdm_datos.sp_crear_tabla_typeOfData10
          step_description: "Crea la tabla intermedia para typeOfData10 (Registraduría)"
