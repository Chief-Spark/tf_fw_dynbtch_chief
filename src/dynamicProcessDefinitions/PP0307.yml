procesos:
  # pipeline: ALPHA   # (opcional) destino Redshift por defecto para todos los steps.
  #                   # Valores: ALPHA (default), NEDA, HYBRID o claves de redshift_targets.
  #                   # Si se omite, se usa ALPHA. Ver docs/componentes/definiciones/redshift-multicluster.md
  directorio:
    ruta: PP0307
  niveles:
    - nivel: 1
      descripcion: "Generación de tabla de catalogo_salario_minimo"
      procedimientos:
        - step_name: "crear_tabla_catalogo_salario_minimo"
          step_procedure: bdm_datos.sp_crear_tabla_catalogo_salario_minimo
          step_description: "Crea la tabla de catalogo_salario_minimo."
    - nivel: 2
      descripcion: "Generación de estadísticas y UNLOAD de la tabla de catalogo_salario_minimo"
      procedimientos:
        - step_name: "calculate_clt"
          step_procedure: bdm_datos.sp_calculate_ctl_files
          step_description: "Genera estadísticas de la tabla de catalogo_salario_minimo."
        - step_name: "unload_to_s3"
          step_procedure: bdm_datos.sp_unload_to_s3_prcss_batch
          step_description: "Exporta la tabla de catalogo_salario_minimo a S3 usando UNLOAD."
  salidas:
    aplica: false
